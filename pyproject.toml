[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-gateway"
version = "0.1.0"
description = "Market Data Gateway: framework-neutral market data contract and services"
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=18",
    # DuckDB 2.x is the supported storage-read baseline; 1.x is forbidden.
    # 2.0 added TIMESTAMPTZ_NS, which preserves Parquet UTC nanoseconds.
    "duckdb>=2.0,<3",
    # Pinned to the version proven by the M1 type/lifecycle spike.
    "polars==2.1.0",
    "pyzmq>=26",
    "PyYAML>=6",
    "pydantic>=2.9",
    "ccxt>=4.5",
    "typer>=0.9",
    # Imported directly by mdgw.cli; newer Typer releases no longer pull it in.
    "click>=8.1",
    # ASGI HTTP surface. Plain uvicorn (no [standard] extra) still needs a
    # WebSocket implementation for /ws; websockets also backs the SDK client.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    # OIDC ID Token signature verification (RS256/ES256 via JWKS) in the
    # Admin API. Deliberately the only crypto dependency; no PyJWT/authlib.
    "cryptography>=42",
]

[project.scripts]
mdgw = "mdgw.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "websockets>=13"]
client-ws = ["websockets>=13"]
# Optional consumer stack for examples/nautilus_macd_backtest.py.
nautilus = ["nautilus-trader>=2.0.0rc7", "numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Admin schema migrations are data files discovered by the runner at runtime.
"mdgw.admin" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import `mdgw` from this checkout's `src/`, not from another editable install.
pythonpath = ["src"]
addopts = "-ra -m 'not network'"
markers = [
    "network: tests that reach a real Venue (skipped by default)",
]

[tool.ruff.lint]
# Ruff linting configuration
preview = true

extend-select = [
    "A", "ARG", "ASYNC", "B", "C4", "COM", "DJ", "EM", "ERA",
    "FURB", "FLY", "G", "I", "ICN", "INP", "INT", "ISC", "LOG",
    "N", "NPY", "PERF", "PD", "PIE", "PGH", "PL", "PT", "PTH",
    "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "TCH", "TID",
    "TRY", "UP", "YTT", "E501",
]

ignore = [
    "COM812",
    "ISC001",
    "PGH003",
    "PLR0904",
    "PLR2004",
    "S101",
    "TID252",
]