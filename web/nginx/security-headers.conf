# Security response headers shared by both runtime modes.
#
# CSP: the bundle is fully self-hosted. `style-src 'unsafe-inline'` is required
# by ECharts/Radix DOM style attributes; there is no external origin. `'self'`
# covers same-origin REST/WebSocket connects in current browsers.
#
# HSTS is intentionally NOT emitted by the container: this image terminates
# plain HTTP by default. Enable Strict-Transport-Security at the TLS
# terminator (or uncomment the line below when this Nginx terminates TLS).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
