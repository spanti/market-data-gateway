# Trusted proxy boundary.
#
# This is the only proxy in front of the API for this deployment. Forwarding
# headers are SET (overwritten), never appended: a client-supplied
# X-Forwarded-For / X-Real-IP / Forwarded value must not reach the backend.
# The API must be configured to trust forwarding headers only from this proxy
# (or from an explicitly configured upstream TLS terminator using real_ip).
#
# If a TLS terminator/LB is placed in front, configure `real_ip_header` and
# `set_real_ip_from` there; otherwise $remote_addr is that LB.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_connect_timeout 10s;
